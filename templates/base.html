<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wingato — Open Media Downloader{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/open.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="terminal">
        <div class="terminal-header">
            <span class="terminal-dot red"></span>
            <span class="terminal-dot yellow"></span>
            <span class="terminal-dot green"></span>
            <span class="terminal-title">wingato — open media</span>
        </div>
        <nav class="nav">
            <a href="/" class="nav-link"><span class="prompt">$</span> ./home</a>
            <a href="/about" class="nav-link"><span class="prompt">$</span> ./about</a>
            <a href="/contact" class="nav-link"><span class="prompt">$</span> ./contact</a>
        </nav>

        <main class="content">
            {% block content %}{% endblock %}
        </main>

        <footer class="footer">
            <p class="footer-text">Wingato downloads only openly-licensed and public-domain media. We host nothing.</p>
            <p class="footer-text">&copy; 2026 Wingato. All rights reserved.</p>
        </footer>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
